name: Rahul - Deploy to Azure Container App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name rahulregistry

      - name: Build Docker image
        run: |
          docker build -t rahulregistry.azurecr.io/rahul-containerapp:latest .

      - name: Push Docker image to ACR
        run: |
          docker push rahulregistry.azurecr.io/rahul-containerapp:latest

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name rahul-containerapp \
            --resource-group Rahul6.1 \
            --image rahulregistry.azurecr.io/rahul-containerapp:latest
